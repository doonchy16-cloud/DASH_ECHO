name: ECHO_DASH v1.1 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ECHO_DASH
        uses: actions/checkout@v4

      - name: Run v1.1 contract regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest tests.test_v1_1_contract -v

      - name: Install pinned Geode CLI 3.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-win.zip'
          $expected = '467ac1fa975e391c32c894a7aff659949dbde5d32656bd13797f78f366da6c26'
          $zip = Join-Path $env:RUNNER_TEMP 'geode-cli-v3.7.4-win.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'geode-cli-v3.7.4'

          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Geode CLI checksum mismatch. Expected $expected but got $actual"
          }

          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter 'geode.exe' | Select-Object -First 1
          if (-not $exe) {
            throw 'geode.exe was not found in the verified CLI archive'
          }

          $cliDir = Split-Path -Parent $exe.FullName
          $cliDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName --version

      - name: Install pinned Geode SDK 5.10.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'geode-sdk-v5.10.1'
          git clone --depth 1 --branch v5.10.1 https://github.com/geode-sdk/geode.git $sdk
          "GEODE_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:GEODE_SDK = $sdk

          $profileDir = Join-Path $env:RUNNER_TEMP 'echo-dash-ci-profile'
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          $dummyGd = Join-Path $profileDir 'GeometryDash.exe'
          New-Item -ItemType File -Path $dummyGd -Force | Out-Null

          $geodeRoot = Join-Path $env:LOCALAPPDATA 'Geode'
          New-Item -ItemType Directory -Path $geodeRoot -Force | Out-Null
          $config = [ordered]@{
            'current-profile' = 'ci'
            'profiles' = @(
              [ordered]@{
                'name' = 'ci'
                'gd-path' = $dummyGd
                'platform' = 'win'
              }
            )
            'default-developer' = $null
            'sdk-nightly' = $false
            'sdk-version' = '5.10.1'
            'index-token' = $null
            'index-url' = 'https://api.geode-sdk.org'
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $geodeRoot 'config.json') -Encoding utf8

          geode sdk version
          geode sdk install-binaries --platform win --version 5.10.1

      - name: Build Windows Release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          geode build --config Release

      - name: Collect ECHO_DASH package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $packages = Get-ChildItem -Path $PWD -Recurse -File -Filter '*.geode' |
            Where-Object { $_.FullName -notmatch '\\_deps\\' }

          if (-not $packages) {
            throw 'Build completed without producing any .geode package'
          }

          if ($packages.Count -ne 1) {
            throw "Expected exactly one ECHO_DASH .geode package, found $($packages.Count)"
          }

          Copy-Item -Path $packages[0].FullName -Destination $dist -Force
          Write-Host "Collected package: $($packages[0].FullName)"

      - name: Upload v1.1.0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ECHO-DASH-v1.1.0-windows
          path: dist/*.geode
          if-no-files-found: error
          retention-days: 30
